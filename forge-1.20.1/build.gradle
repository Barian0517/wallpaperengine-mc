plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'moe.barian.wallpaperengine'
base { archivesName = 'wallpaperengine-mc-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'wallpaperengine_mc'
            arg "-mixin.config=wallpaperengine_mc.mixins.json"
            mods {
                wallpaperengine_mc {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation project(':core')
}

mixin {
    add sourceSets.main, "wallpaperengine_mc.refmap.json"
    config "wallpaperengine_mc.mixins.json"
}
