plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = '1.0.0'
group = 'moe.barian.wallpaperengine'
base { archivesName = 'wallpaperengine-mc-neoforge-1.21.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

neoForge {
    version = '21.1.61'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'wallpaperengine_mc'
        }
    }

    mods {
        wallpaperengine_mc {
            sourceSet(project.sourceSets.main)
        }
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0'
    implementation 'net.java.dev.jna:jna-platform:5.13.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
